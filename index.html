<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart To-do App</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="overlay">
        <div class="container">
            <h1>Smart To-do <i class="fa-solid fa-list-check" id="list"></i></h1>
            <p class="subtitle">Organize your day, one task at a time</p>
            <div class="input-section">
                <input type="text"
                       id = "taskInput"
                       placeholder="What do you need to do today?"
                >
                <button id="addTask">+</button>
            </div>
            <div class="filters">
                 <button class="filter-btn active" data-filter="all">All</button>
                 <button class="filter-btn" data-filter="active">Active</button>
                 <button class="filter-btn" data-filter="completed">Completed</button>
            </div>

            <div id="taskList"></div>

            <div id="emptyState">
                <i class="fa-solid fa-clipboard-list"></i>
                <h3>No tasks yet!</h3>
                <p>Add your first task and start being productive.</p>
            </div>
          

            <div class="bottom">
                <p>
                    Total: <span id="taskCount">0</span>
                    &nbsp; | &nbsp;
                    Completed: <span id="completedCount">0</span>
                    &nbsp; | &nbsp;
                    Remaining: <span id="remainingCount">0</span>
                </p>

                <p class="progress-text">
                        Progress: <span id="progressPercent">0%</span>
                </p>
                <div class="progress">
                    <div class="progress-bar"></div>
                </div>
                <p id="completionMessage"></p>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
    <div id="toast"></div>
    <script src="script.js"></script>
</body>
</html>
